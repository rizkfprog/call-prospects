  color-scheme:dark }

<script>
"use strict";
const B01=18428079878, B02=18428079909, B04=18437579770, SERVER="monday.com", TOOL="all_monday_api";
const API="https://api.monday.com/v2";
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
let TOKEN=store.get("cadran.token");
let SEED={at:"",raw:{b01:[],b02:[]}};try{const c=JSON.parse(store.get("cadran.cache")||"null");if(c&&c.raw)SEED=c}catch(e){}
const TODAY=new Date(); TODAY.setHours(0,0,0,0);
const iso=d=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};
const T=iso(TODAY);
const addBD=(n)=>{const d=new Date(TODAY);let k=0;while(k<n){d.setDate(d.getDate()+1);if(d.getDay()%6)k++;}return iso(d)};
const addD=(n)=>{const d=new Date(TODAY);d.setDate(d.getDate()+n);return iso(d)};
const daysBetween=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
const fmtD=s=>{if(!s)return"";const[y,m,d]=s.split("-");return d+"/"+m};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const urlOf=s=>{const m=/https?:\/\/\S+/.exec(s||"");return m?m[0]:null};
const fmtTel=t=>{if(!t)return"";const d=t.replace(/\D/g,"");const n=d.length===11&&d[0]==="1"?d.slice(1):d;return n.length===10?`${n.slice(0,3)} ${n.slice(3,6)}-${n.slice(6)}`:t};
const telHref=(t,ext)=>"tel:"+(t||"").replace(/[^\d+]/g,"")+(ext?","+String(ext).replace(/\D/g,""):"");

const STAGES=["1 - À contacter","2 - En discussion","3 - RDV / rencontre","4 - Mandat proposé","5 - Mandat en cours","6 - Client","🔁 Réactivation","❌ Perdu"];
const RANK=Object.fromEntries(STAGES.map((s,i)=>[s,i]));
const STAGE_W={"4 - Mandat proposé":90,"3 - RDV / rencontre":80,"2 - En discussion":55,"1 - À contacter":45,"🔁 Réactivation":35,"5 - Mandat en cours":25,"6 - Client":20,"❌ Perdu":5};
const NOANS=new Set(["📵 Pas joint"]);

/* ---------- model ---------- */
const cv=(it,id)=>{const c=(it.column_values||[]).find(c=>c.id===id);return c?(c.text||""):""};
const cvl=(it,id)=>{const c=(it.column_values||[]).find(c=>c.id===id);return c&&c.linked_item_ids||[]};
function build(raw){
  const b2ByContact={};
  for(const it of raw.b02||[]){for(const c of cvl(it,"board_relation_mkwsc5xn"))b2ByContact[c]=it}
  const seen=new Set(), out=[];
  for(const o of raw.b01||[]){
    const a=b2ByContact[o.id]; if(a)seen.add(a.id);
    const postes=(o.subitems||[]).map(s=>({t:s.name,st:cv(s,"status"),d:cv(s,"date0"),pr:cv(s,"color_mm6m8p7d"),url:urlOf(cv(s,"link_mm6mbqpf")),v:cv(s,"text_mm6mzxpx")}));
    const open=postes.filter(p=>p.st!=="Retirée");
    if(!a && !open.length) continue;
    if(cv(o,"color_mm7qdz9m")==="Hors périmètre"||cv(o,"color_mm839dfs")==="Agence (hors périmètre)") continue;
    if(!a && cv(o,"statut")==="✅ Client") continue;
    const p=mk(o,a,postes);
    p.noCall=/AUCUNE APPROCHE|NE PAS (SOLLICITER|APPROCHER|RÉAPPROCHER)/i.test(p.angle)||(open.length>0&&open.every(x=>x.pr==="⛔ Ne pas solliciter")&&!a);
    out.push(p);
  }
  for(const a of raw.b02||[]) if(!seen.has(a.id)) out.push(mk(null,a,[]));
  return out;
}

function score(p){
  const open=p.postes.filter(x=>x.st==="Ouverte"||x.st==="À revalider");
  let s=STAGE_W[p.stage]??30, why=[];
  const due=p.nextDate?daysBetween(p.nextDate,T):null;
  if(due!==null){ if(due>=0){s+=30+Math.min(due,20);why.push(due===0?["Prévu aujourd'hui","acc"]:[`En retard ${due} j`,"hot"])} else {s-=80;why.push([`Prévu le ${fmtD(p.nextDate)}`,"cold"])} }
  else if(p.stage==="1 - À contacter") why.push(["Jamais appelé","acc"]);
  if(open.length){s+=Math.min(open.length,3)*8;why.push([open.length+(open.length>1?" postes ouverts":" poste ouvert"),"good"])}
  if(p.postes.some(x=>x.pr==="🔥 Signal fort"&&x.st!=="Retirée")){s+=15;why.push(["Signal fort","hot"])}
  const fresh=open.length&&open.every(x=>x.d&&daysBetween(x.d,T)<21);
  if(fresh&&!p.hist.length){s-=12;why.push(["Poste < 3 sem.","warn"])}
  const old=open.find(x=>x.d&&daysBetween(x.d,T)>=45); if(old){s+=10;why.push([`Ouvert depuis ${daysBetween(old.d,T)} j`,"warn"])}
  if(p.prio.startsWith("A")){s+=25;why.unshift(["Priorité A","hot"])} else if(p.prio.startsWith("B")) s+=10;
  if(p.noCall){s-=300;why.unshift(["Ne pas solliciter","hot"])}
  if(p.stage==="❌ Perdu"&&(due===null||due<0)) s-=60;
  const ph=bestPhone(p); if(!ph) s-=200;
  return {s:Math.round(s),why};
}
function bestPhone(p){return p.dec.tel||(p.res&&p.res.tel)||p.std||""}
function isDue(p){ if(!bestPhone(p)||p.noCall)return false; if(["❌ Perdu","6 - Client"].includes(p.stage)&&!(p.nextDate&&p.nextDate<=T))return false; return !p.nextDate||p.nextDate<=T }

  for(const p of P){const r=score(p);p.score=r.s;p.why=r.why}
  queue=P.filter(p=>isDue(p)&&!skipped.has(key(p))).sort((a,b)=>b.score-a.score);
  if(cur>=queue.length)cur=0;
}

function plan(p,r,k){
  const tries=p.hist.filter(h=>NOANS.has(h.r)).length+(NOANS.has(r)?1:0);
  let stage=RANK[p.stage]>=1&&p.stage!=="🔁 Réactivation"&&p.stage!=="❌ Perdu"?p.stage:"2 - En discussion", next="📞 Appel", date=addBD(2), cause=null, txt="";
  if(NOANS.has(r)){ if(tries>=6){stage="🔁 Réactivation";date=addD(45);txt=`${tries} tentatives sans réponse : pause 45 jours.`} else if(tries%3===0){next="✉️ Courriel";date=addBD(1);txt=`${tries}e tentative : courriel demain, puis on rappelle.`} else {date=addBD(2);txt=`Tentative ${tries} : rappel dans 2 jours ouvrables.`} }
  else if(r==="🔄 À relancer"){date=addBD(3);txt="Rappel dans 3 jours ouvrables."}
  else if(r==="👍 Positif"){next="🤝 Rencontre";date=addBD(2);txt="Proposer une rencontre sous 2 jours."}
  else if(r==="📅 RDV obtenu"){stage="3 - RDV / rencontre";next="🤝 Rencontre";date=addBD(3);txt="Indiquez la date du RDV."}
  else if(r==="❌ Pas intéressé"){stage="❌ Perdu";cause="Pas de besoin actuellement";date=addD(90);txt="Classé perdu, relance dans 90 jours."}
  // Never move a prospect backwards in the pipeline, short of Perdu.
  if(RANK[p.stage]>RANK[stage]&&RANK[p.stage]<=RANK["6 - Client"]&&stage!=="❌ Perdu") stage=p.stage;
  return {stage,next,date,cause,txt};
}

    if(b.tagName!=="A")ev.preventDefault();
    const t=b.dataset.copy; try{navigator.clipboard.writeText(t).then(()=>toast("Copié : "+t),()=>{})}catch(e){}
  }));
  document.querySelectorAll("[data-r]").forEach(b=>b.addEventListener("click",()=>{sel.r=b.dataset.r;sel.dateTouched=false;keepNote();render()}));

  const sk=$("#skip"); if(sk)sk.addEventListener("click",()=>{skipped.add(key(queue[cur]));reset();render();scrollTo(0,0)});
  const sv=$("#save"); if(sv)sv.addEventListener("click",save);
  const lo=$("#logout"); if(lo)lo.addEventListener("click",()=>{TOKEN=null;store.set("cadran.token",null);store.set("cadran.cache",null);RAW={b01:[],b02:[]};P=[];live=false;setSync("","Déconnecté");render()});
  const qi=$("#q"); if(qi){qi.addEventListener("input",()=>{q=qi.value;const pos=qi.selectionStart;render();const n=$("#q");n.focus();n.setSelectionRange(pos,pos)})}
}
function wireLogin(){const b=$("#connect"),i=$("#tok"),m=$("#loginMsg");if(!b)return;
  const go=async()=>{const v=i.value.trim();if(!v){m.textContent="Collez d'abord votre jeton.";return}
    b.disabled=true;m.textContent="Vérification…";TOKEN=v;
    try{const d=await gql("query{me{name}}");store.set("cadran.token",v);m.textContent="";toast("Connecté : "+d.me.name);render();refresh()}
    catch(e){TOKEN=null;b.disabled=false;m.textContent=e.code==="auth"?"Monday refuse ce jeton. Recopiez-le en entier depuis My access tokens.":"Pas de réseau. Réessayez une fois connecté."}};
  b.addEventListener("click",go);i.addEventListener("keydown",e=>{if(e.key==="Enter")go()})}
function keepNote(){const n=$("#note");if(n)sel.note=n.value}
function reset(){sel={r:null,k:"📞 Appel",note:"",date:"",dateTouched:false}}
function openP(k){
  skipped.delete(k); recompute();
  let i=queue.findIndex(p=>key(p)===k);
  if(i<0){const p=P.find(p=>key(p)===k); if(!p)return; queue.unshift(p); i=0;}
  cur=i; view="appel"; reset(); render(); scrollTo(0,0);
}
document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>{view=b.dataset.v;try{localStorage.setItem("cadran.view",view)}catch(e){}render()}));

/* ---------- Monday (live) ---------- */
async function gql(query,variables){
  let r;
  try{r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json","Authorization":TOKEN},body:JSON.stringify({query,variables:variables||{}})})}
  // Monday's 401 replies carry no CORS header, so a refused token surfaces as a network failure while online.
  catch(e){throw {code:navigator.onLine===false?"offline":"auth"}}
  if(r.status===401||r.status===403) throw {code:"auth"};
  if(r.status===429) throw {code:"rate",retryable:true,retryAfterMs:15000};
  if(!r.ok) throw {code:"http",message:"HTTP "+r.status,retryable:r.status>=500};
  const d=await r.json();
  if(d.errors||d.error_message) throw {code:"tool_error",message:JSON.stringify(d.errors||d.error_message)};
  return d.data;
}

async function pageAll(board,fields){
  let items=[], d=await gql(`query{boards(ids:[${board}]){items_page(limit:250){cursor items{${fields}}}}}`);
  let pg=d.boards[0].items_page; items=items.concat(pg.items);
  while(pg.cursor){d=await gql(`query($c:String!){next_items_page(cursor:$c,limit:250){cursor items{${fields}}}}`,{c:pg.cursor});pg=d.next_items_page;items=items.concat(pg.items)}
  return items;
}
const ERRTXT={auth:"Jeton Monday refusé : reconnectez-vous dans Chercher.",offline:"Hors ligne",rate:"Monday limite les appels, nouvel essai bientôt"};
function setSync(state,txt){$("#dot").className="dot "+(state==="live"?"live":state==="err"?"err":"");$("#syncTxt").textContent=txt}
async function refresh(){
  if(!TOKEN){setSync("","Non connecté");return}
  setSync("","Synchronisation…");
  try{
    const [b01,b02,b04]=await Promise.all([pageAll(B01,F01),pageAll(B02,F02),pageAll(B04,F04).catch(()=>null)]);
    RAW={b01,b02,b04}; P=build(RAW); live=true;
    const st=new Date(); SNAP=st.toLocaleDateString("fr-CA")+" "+st.toLocaleTimeString("fr-CA",{hour:"2-digit",minute:"2-digit"});
    store.set("cadran.cache",JSON.stringify({at:SNAP,raw:RAW}));
    const now=new Date(); setSync("live","Monday "+String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0"));
    const k=queue[cur]&&key(queue[cur]); render(); if(k){const i=queue.findIndex(p=>key(p)===k); if(i>=0){cur=i;render()}}
  }catch(e){
    live=false; setSync("err",ERRTXT[e&&e.code]||("Monday indisponible ("+(e&&e.code||"erreur")+")"));
    if(e&&e.code==="auth"){TOKEN=null;store.set("cadran.token",null)}
    if(e&&e.retryable&&!refresh.retried){refresh.retried=true;setTimeout(refresh,(e.retryAfterMs||1500)+Math.random()*800)}
    render();
  }
}
$("#refresh").addEventListener("click",()=>{refresh.retried=false;refresh()});

async function save(){
  const p=queue[cur]; if(!p||!sel.r||busy||!live)return;
  keepNote(); busy=true; render();
  const pl=plan(p,sel.r,sel.k); const date=sel.date||pl.date;
  try{
    let id02=p.id02;
    if(!id02){
      const d=await gql(`mutation($n:String!,$v:JSON!){create_item(board_id:${B02},group_id:"topics",item_name:$n,column_values:$v){id}}`,{n:p.org,v:JSON.stringify({board_relation_mkwsc5xn:{item_ids:[Number(p.id01)]}})});
      id02=d.create_item.id; p.id02=id02;
    }
    await gql(`mutation($n:String!,$v:JSON!){create_subitem(parent_item_id:${id02},item_name:$n,column_values:$v){id}}`,{n:p.org,v:JSON.stringify({color_mm37p8a4:{label:sel.k},date_mm37s3q6:{date:T},color_mm37ysrg:{label:sel.r},text_mm37dgay:sel.note||""})});
    const cvs={color_mm37mcck:{label:pl.stage},color_mkw67t3h:{label:pl.next},date_mm378gzb:{date}};
    if(pl.cause)cvs.color_mm37nz0a={label:pl.cause};
    await gql(`mutation($v:JSON!){change_multiple_column_values(board_id:${B02},item_id:${id02},column_values:$v){id}}`,{v:JSON.stringify(cvs)});
    // Contacts with no Statut become Prospect; a Prospect turned down becomes Perdu. Clients are left alone.
    const st01=pl.stage==="❌ Perdu"?"❌ Perdu":"🎯 Prospect";
    if(p.id01&&(!p.statut||(p.statut==="🎯 Prospect"&&st01!==p.statut))){
      try{await gql(`mutation($v:JSON!){change_multiple_column_values(board_id:${B01},item_id:${p.id01},column_values:$v){id}}`,{v:JSON.stringify({statut:{label:st01}})});p.statut=st01}catch(e){}
    }
    p.hist.unshift({k:sel.k,d:T,r:sel.r,n:sel.note}); p.stage=pl.stage; p.next=pl.next; p.nextDate=date;
    toast("Enregistré dans Monday : "+p.org);
    busy=false; reset(); render(); scrollTo(0,0);
  }catch(e){
    busy=false; render();
    toast(e&&e.code==="tool_error"?"Monday a refusé l'enregistrement : "+String(e.message||"").slice(0,120):e&&e.code==="auth"?ERRTXT.auth:"Enregistrement incertain. Vérifiez la fiche dans Monday avant de réessayer.");
  }
}
